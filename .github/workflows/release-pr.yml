name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to retry
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-version: ${{ steps.release.outputs.version || inputs.version }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: release
        if: github.event_name == 'push'
        name: Detect a merged version change
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          previous=$(git show "$before:packages/core/package.json" 2>/dev/null || true)
          test -n "$previous" || exit 0
          current_version=$(node -p 'require("./packages/core/package.json").version')
          previous_version=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<<"$previous")
          test "$current_version" != "$previous_version" || exit 0
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v4
        if: github.event_name == 'push'
      - run: bun install --frozen-lockfile
        if: github.event_name == 'push'
      # v1.9.0; version PRs only. Publishing stays in release.yml so Bun packs catalogs.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        if: github.event_name == 'push'
        with:
          version: bun run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"

  release:
    needs: version-pr
    if: needs.version-pr.outputs.release-version != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.version-pr.outputs.release-version }}
    permissions:
      contents: write
      id-token: write
