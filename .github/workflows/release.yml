name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - id: release
        name: Detect a merged version change
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if ! previous=$(git show "$before:packages/core/package.json"); then
            echo "::error::Could not read packages/core/package.json at $before" >&2
            exit 1
          fi
          # All public packages are one Changesets fixed group, so core represents the release version.
          current_version=$(node -p 'require("./packages/core/package.json").version')
          previous_version=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<<"$previous")
          test "$current_version" != "$previous_version" || exit 0
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      # Version PRs only. Publishing stays in the publish job so Bun packs catalogs.
      - uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          push-with-git-cli: true

  publish:
    needs: version-pr
    if: needs.version-pr.outputs.release-version != ''
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: v${{ needs.version-pr.outputs.release-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run build:pkgs
      - run: bun run test:release
      # build:release cross-compiles a binary into every platform package.
      - run: bun run --cwd packages/cli build:release
      # Bun packs (rewriting catalog:/workspace:), npm publishes (OIDC). Skipping
      # already-published versions keeps a re-run after partial failure safe.
      - name: Pack and publish packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          mkdir packages-to-publish
          for dir in packages/core packages/sdk packages/providers packages/channels packages/tui packages/cli/npm/cli-* packages/cli packages/create-mitome; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "${name}@${RELEASE_TAG#v}" version >/dev/null 2>&1; then
              echo "Already published: ${name}"
              continue
            fi
            cp LICENSE "$dir/"
            archive=$(cd "$dir" && bun pm pack --quiet --destination "$GITHUB_WORKSPACE/packages-to-publish" --ignore-scripts)
            npm publish "$archive" --access public
          done
      - name: Create version tag if needed
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [[ -z "$existing" ]]; then
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            # A pre-existing tag must point at the verified release source.
            test "$existing" = "$RELEASE_SHA"
          fi
      - name: Create the tagged release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG"

  deploy-docs:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run build:docs
      - name: Deploy docs to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
