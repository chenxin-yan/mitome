name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: test "${RELEASE_TAG#v}" = "$(node -p 'require("./packages/core/package.json").version')"
      - run: bun run check:lockstep
      - run: TURBO_FORCE=true bun run check
      - run: TURBO_FORCE=true bun run build
      - run: TURBO_FORCE=true bun run test

  build-binaries:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # build:release cross-compiles every supported target from one host and
      # writes a sorted checksum manifest beside the per-target binaries.
      - run: bun run --cwd packages/cli build:release
      - name: Verify and flatten binaries
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/cli/dist/release && sha256sum -c checksums.sha256)
          mkdir release-assets
          while read -r _ asset; do
            cp "packages/cli/dist/release/$asset" "release-assets/$(basename "$asset")"
          done < packages/cli/dist/release/checksums.sha256
          test "$(find release-assets -maxdepth 1 -type f -name 'mitome-*' | wc -l)" -eq 8
          (cd release-assets && sha256sum mitome-* | sort > checksums.sha256 && sha256sum -c checksums.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets

  publish:
    needs: [verify, build-binaries]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - run: bun install --frozen-lockfile
      - run: bun run check:lockstep
      - run: bun run build
      - run: bun run test:release
      - run: npm install --global npm@11.5.1 && npm --version
      - name: Pack packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          mkdir packages-to-publish
          for package in core sdk providers cli; do
            (cd "packages/$package" && bun pm pack --destination "$GITHUB_WORKSPACE/packages-to-publish" --ignore-scripts)
          done
      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Publish packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          for package in core sdk providers cli; do
            archive="packages-to-publish/mitome-${package}-${RELEASE_TAG#v}.tgz"
            test -f "$archive"
            npm publish "$archive" --access public --provenance
          done
      - name: Create the immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG"
