name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./packages/core/package.json").version')"
      - run: bun run check:lockstep
      - run: TURBO_FORCE=true bun run check
      - run: rm -rf packages/*/dist && TURBO_FORCE=true bun run test
      - run: bun run build
      - run: bun run test:release
      - run: bun run release:dry-run

  build-binaries:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # build:release cross-compiles every supported target from one host and
      # writes a sorted checksum manifest beside the per-target binaries.
      - run: bun run --cwd packages/cli build:release
      - name: Verify and flatten binaries
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/cli/dist/release && sha256sum -c checksums.sha256)
          mkdir release-assets
          while read -r _ asset; do
            cp "packages/cli/dist/release/$asset" "release-assets/$(basename "$asset")"
          done < packages/cli/dist/release/checksums.sha256
          test "$(find release-assets -maxdepth 1 -type f -name 'mitome-*' | wc -l)" -eq 8
          (cd release-assets && sha256sum mitome-* | sort > checksums.sha256 && sha256sum -c checksums.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets

  publish:
    needs: [verify, build-binaries]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - run: bun install --frozen-lockfile
      - run: bun run check:lockstep
      - run: bun run build
      - run: bun run test:release
      - run: npm install --global npm@11.5.1 && npm --version
      - name: Pack and publish in dependency order
        shell: bash
        run: |
          set -euo pipefail
          mkdir packages-to-publish
          for package in core sdk openai openai-compatible openai-codex cli; do
            (cd "packages/$package" && bun pm pack --destination "$GITHUB_WORKSPACE/packages-to-publish" --ignore-scripts)
          done
          for package in core sdk openai openai-compatible openai-codex cli; do
            archive="packages-to-publish/mitome-${package}-${GITHUB_REF_NAME#v}.tgz"
            test -f "$archive"
            npm publish "$archive" --access public --provenance
          done
      - name: Create the immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME"
