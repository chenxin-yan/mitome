name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        name: Detect a merged version change
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if ! previous=$(git show "$before:packages/core/package.json"); then
            echo "::error::Could not read packages/core/package.json at $before" >&2
            exit 1
          fi
          # All public packages are one Changesets fixed group, so core represents the release version.
          current_version=$(node -p 'require("./packages/core/package.json").version')
          previous_version=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' <<<"$previous")
          test "$current_version" != "$previous_version" || exit 0
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # v1; version PRs only. Publishing stays in the publish job so Bun packs catalogs.
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"

  publish:
    needs: version-pr
    if: needs.version-pr.outputs.release-version != ''
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: v${{ needs.version-pr.outputs.release-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Bun version comes from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Verify release tag matches source
        run: test "${RELEASE_TAG#v}" = "$(node -p 'require("./packages/core/package.json").version')"
      - run: bun install --frozen-lockfile
      - run: bun run build:pkgs
      - run: bun run test:release
      # build:release cross-compiles a binary into every platform package.
      - run: bun run --cwd packages/cli build:release
      - name: Pack packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          mkdir packages-to-publish
          for dir in packages/core packages/sdk packages/providers packages/cli/npm/cli-* packages/cli packages/create-mitome; do
            cp LICENSE "$dir/"
            (cd "$dir" && bun pm pack --destination "$GITHUB_WORKSPACE/packages-to-publish" --ignore-scripts)
          done
      - name: Publish or verify packages in dependency order
        shell: bash
        run: |
          set -euo pipefail

          publish_archive() {
            local archive=$1 name=$2
            if npm view "${name}@${RELEASE_TAG#v}" version >/dev/null 2>&1; then
              echo "Already published: ${name}"
            else
              npm publish "$archive" --access public
            fi
          }

          for dir in packages/core packages/sdk packages/providers packages/cli/npm/cli-* packages/cli packages/create-mitome; do
            package_dir=$(basename "$dir")
            if test "$package_dir" = create-mitome; then
              archive="packages-to-publish/create-mitome-${RELEASE_TAG#v}.tgz"
            else
              archive="packages-to-publish/mitome-${package_dir}-${RELEASE_TAG#v}.tgz"
            fi
            publish_archive "$archive" "$(node -p "require('./$dir/package.json').name")"
          done
      - name: Create version tag if needed
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [[ -z "$existing" ]]; then
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            # A pre-existing tag must point at the verified release source.
            test "$existing" = "$RELEASE_SHA"
          fi
      - name: Create the tagged release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG"
